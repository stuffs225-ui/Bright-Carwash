name: Carwash V2 checks
on:
  push:
    branches:
      - chatgpt/carwash-approved-optimization-20261112
      - chatgpt/carwash-v2-secure-preview-20261101
      - chatgpt/bright-carwash-approved-phases-20261107
      - chatgpt/carwash-ui-finance-governance-20261107
      - chatgpt/bright-carwash-integrated-ux-ops-20261107
      - chatgpt/bright-carwash-final-audit-20261107
      - chatgpt/bright-carwash-backup-cache-verification-20261108
      - chatgpt/bright-carwash-reliability-fixes-20261109
      - chatgpt/bright-carwash-fast-registration-inventory-20261109
      - chatgpt/carwash-daily-wages-worker-close-20261111
      - chatgpt/carwash-manager-parity-variance-ready-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'chatgpt/carwash-approved-optimization-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Domain tests
        run: npm test
      - name: Private snapshot importer safety preflight (synthetic, no database)
        run: |
          node --check scripts/bootstrap-carwash-manager.mjs
          node --check scripts/import-private-carwash-snapshot.mjs
          node scripts/import-private-carwash-snapshot.mjs qa/synthetic_carwash_import.json > /tmp/carwash-import-check.txt
          grep 'DRY RUN ONLY' /tmp/carwash-import-check.txt
      - name: Check static offline worker script
        run: node --check public/worker-offline.js
      - name: Type checking
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder-no-real-credentials
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile registration and offline replay (synthetic API only)
        run: |
          set -euo pipefail
          npm run start > /tmp/carwash-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          BROWSER=chromium node qa/mobile-acceptance.cjs
          BROWSER=webkit node qa/mobile-acceptance.cjs
          BROWSER=webkit node qa/worker-language-acceptance.cjs
          BROWSER=chromium node qa/worker-language-acceptance.cjs
          node qa/worker-offline-locale-acceptance.cjs
          node --check public/worker-offline.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder-no-real-credentials
      - name: Package exact tested source for QA
        if: success()
        run: |
          mkdir -p qa-archive
          git archive --format=zip --output=qa-archive/carwash-v2-exact-tested-source.zip HEAD
          (cd qa-archive && sha256sum carwash-v2-exact-tested-source.zip > SHA256SUMS.txt)
      - name: Retain tested source as workflow artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bright-carwash-qa-source
          path: qa-archive/
          retention-days: 7
          if-no-files-found: error

  database-smoke:
    if: github.event_name == 'workflow_dispatch' || github.ref_name != 'chatgpt/carwash-approved-optimization-20261112'
    name: "Synthetic PostgreSQL migrations / RLS / shift close"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: carwash-ci-only
          POSTGRES_DB: carwash_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carwash_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply every carwash migration and validate financial workflow using synthetic users
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=carwash-ci-only \
            -v "$PWD:/src:ro" -w /src postgres:16 \
            bash -ceu '
              export PGHOST=127.0.0.1 PGUSER=postgres PGDATABASE=carwash_synthetic
              psql -v ON_ERROR_STOP=1 -f qa/supabase_postgres_test_bootstrap.sql
              for f in supabase/migrations/*.sql; do
                echo "Testing migration: $f"
                psql -v ON_ERROR_STOP=1 -f "$f"
                if [[ "$f" == *"/0019_reconciliation_audit.sql" ]]; then
                  psql -v ON_ERROR_STOP=1 -f qa/carwash_postgres_e2e.sql
                fi
              done
              psql -v ON_ERROR_STOP=1 -f qa/carwash_calendar_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_single_manager_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_pin_import_whatsapp_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_backup_restore_rehearsal.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_worker_phone_regex_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_month_close_governance_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_integrated_v2_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_finance_completion_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_independent_addon_policies_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_inventory_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_worker_report_wages_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_manager_report_e2e.sql
              psql -v ON_ERROR_STOP=1 -f qa/carwash_missing_membership_e2e.sql
            '

  focused-ui:
    name: Focused mobile registration and settlement UI
    if: github.event_name == 'push' && github.ref_name == 'chatgpt/carwash-approved-optimization-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Only touched-feature tests
        run: npx vitest run lib/expenseCategories.test.ts lib/expenseDates.test.ts lib/workers.test.ts
      - name: Type-check and compile changed pages
        run: npx tsc --noEmit && npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder-no-real-credentials
      - name: Install focused mobile browser engines
        run: npx playwright install --with-deps webkit chromium
      - name: Worker registration, encrypted drafts and offline acceptance
        run: |
          set -euo pipefail
          npm run start > /tmp/carwash-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          BROWSER=webkit node qa/mobile-acceptance.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder-no-real-credentials
  focused-database:
    name: Targeted manager day-close security and totals
    if: github.event_name == 'push' && github.ref_name == 'chatgpt/carwash-approved-optimization-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: carwash-ci-only
          POSTGRES_DB: carwash_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carwash_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Migrated schema and direct manager close only
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e PGPASSWORD=carwash-ci-only \
            -v "$PWD:/src:ro" -w /src postgres:16 \
            bash -ceu '
              export PGHOST=127.0.0.1 PGUSER=postgres PGDATABASE=carwash_synthetic
              psql -v ON_ERROR_STOP=1 -f qa/supabase_postgres_test_bootstrap.sql >/dev/null
              for f in supabase/migrations/*.sql; do
                psql -v ON_ERROR_STOP=1 -f "$f" >/dev/null
              done
              psql -v ON_ERROR_STOP=1 -f qa/carwash_manager_direct_close_e2e.sql
            '
