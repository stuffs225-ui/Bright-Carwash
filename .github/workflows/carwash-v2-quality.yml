name: Carwash V2 checks
on:
  push:
    branches:
      - chatgpt/carwash-v2-secure-preview-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Domain tests
        run: npm test
      - name: Type checking
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: validation-placeholder-no-real-credentials
      - name: Package exact tested source for QA
        if: success()
        run: |
          mkdir -p qa-archive
          git archive --format=zip --output=qa-archive/carwash-v2-exact-tested-source.zip HEAD
          (cd qa-archive && sha256sum carwash-v2-exact-tested-source.zip > SHA256SUMS.txt)
      - name: Retain tested source as workflow artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bright-carwash-qa-source
          path: qa-archive/
          retention-days: 7
          if-no-files-found: error
