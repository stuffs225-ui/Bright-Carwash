
import { createClient } from "@supabase/supabase-js";
import { createHmac } from "node:crypto";

const {
  NEXT_PUBLIC_SUPABASE_URL: url,
  SUPABASE_SERVICE_ROLE_KEY: serviceKey,
  CARWASH_DATABASE_PROJECT_REF: projectRef,
  CARWASH_BOOTSTRAP_MANAGER_PHONE: phone,
  CARWASH_BOOTSTRAP_MANAGER_PIN: pin,
  CARWASH_PIN_PEPPER: pepper,
} = process.env;

const email = "abrika1999@gmail.com";

if (
  !url || !serviceKey || !projectRef ||
  !phone || !pin || !pepper ||
  !/^\d{4}$/.test(pin) ||
  !/^\+9665\d{8}$/.test(phone) ||
  pepper.length < 32 ||
  new URL(url).hostname !== `${projectRef}.supabase.co`
) {
  throw new Error("Missing or invalid secure configuration");
}

const admin = createClient(url, serviceKey, {
  auth: { persistSession: false, autoRefreshToken: false },
});

async function findUsers() {
  const users = [];

  for (let page = 1; page <= 100; page++) {
    const { data, error } = await admin.auth.admin.listUsers({
      page,
      perPage: 100,
    });

    if (error) throw error;

    users.push(...data.users);

    if (data.users.length < 100) return users;
  }

  throw new Error("User lookup limit exceeded");
}

const users = await findUsers();

const matches = users.filter(
  (u) => u.email?.toLowerCase() === email.toLowerCase()
);

if (matches.length !== 1) {
  throw new Error("Expected exactly one existing email account");
}

const user = matches[0];

if (users.some((u) => u.id !== user.id && u.phone === phone)) {
  throw new Error("Phone is already linked to another account");
}

const { data: membership, error: lookupError } = await admin
  .from("app_members")
  .select("role, active")
  .eq("user_id", user.id)
  .maybeSingle();

if (lookupError) throw lookupError;

if (membership && membership.role !== "manager") {
  throw new Error("Existing role requires manual review");
}

const password =
  "CarwashV2#" +
  createHmac("sha256", pepper)
    .update(`pin-v2|${user.id}|${pin}`)
    .digest("hex");

const { error: updateError } =
  await admin.auth.admin.updateUserById(user.id, {
    phone,
    phone_confirm: true,
    password,
  });

if (updateError) throw updateError;

const { error: memberError } = await admin
  .from("app_members")
  .upsert(
    {
      user_id: user.id,
      role: "manager",
      active: true,
    },
    { onConflict: "user_id" }
  );

if (memberError) {
  throw new Error(
    "Auth updated, but membership failed. Review before retrying."
  );
}

console.log("Manager account activated successfully.");
console.log("Email account retained; phone and PIN configured.");
